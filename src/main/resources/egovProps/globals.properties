# 값은 환경변수를 우선하고, 없으면 콜론 뒤 기본값(로컬 개발용)을 쓴다.
# 서버에서는 /etc/workout/app.env 로 주입한다. 비밀값을 이 파일에 직접 쓰지 않는다.

Globals.Workout.Postgre.Url=${WORKOUT_DB_URL:jdbc:postgresql://localhost:5432/workout}
Globals.Workout.Postgre.UserName=${WORKOUT_DB_USER:workout_app}
Globals.Workout.Postgre.Password=${WORKOUT_DB_PASSWORD:workout_app}

# 회원가입 시 입력해야 하는 코드
Globals.Workout.SignupCode=${WORKOUT_SIGNUP_CODE:dev-signup}

# 카카오맵 JavaScript 키 (Kakao Developers 에서 도메인을 등록한 앱의 키. 브라우저에 노출되므로 도메인 제한으로 보호된다)
Globals.Workout.KakaoJsKey=${WORKOUT_KAKAO_JS_KEY:}
